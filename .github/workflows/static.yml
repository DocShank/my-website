name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NeuroAtlas precision v7.1 manuscript release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          rsync -a --exclude '.git' --exclude 'site' ./ site/

          # Reconstruct the protected viewer, then layer narrow precision fixes.
          python3 site/neuroatlas/build_precision_v2.py site/neuroatlas/index.html
          echo "97ec42ae1b3c5966ad6ffca9e8072aca447daa546ba67ac04256687b66f18c29  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v3_patch.py site/neuroatlas/index.html
          echo "a010ace3cb0c88e83a92fd9d2ca2ebac8597cd62e5b477b0eab66e32caa03b95  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v4_patch.py site/neuroatlas/index.html
          echo "54b9ba81d68e1691f6f73c98f3ec2b38e1ec3411a67c8b84518559e345043cc7  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v5_patch.py site/neuroatlas/index.html
          python3 site/neuroatlas/precision_v6_patch.py site/neuroatlas/index.html
          echo "638652bb9965853873fa85da1f721df8827272e580c4484fd4cfc68b4886e382  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v7_patch.py site/neuroatlas/index.html
          echo "7b38676ca501603ccba409e332aa3e61c82d91d316229f8e760669b34eaa54c3  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v7_1_compliance_patch.py site/neuroatlas/index.html
          echo "5ea0b12226a5dbdcd987e780f739eaf68446a2571109e36f2526c586872a12cb  site/neuroatlas/index.html" | sha256sum -c -

          mkdir -p site/neuroatlas/data

          # Pin the MNI152 demonstration volume to a reviewed NiiVue demo-data
          # revision. The source repository documents it as a downsampled
          # derivative of the ICBM 152 Nonlinear Atlases version 2009.
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue-demo-images/f6f98294c1fa89a3a32e8a44eab92368374150a0/mni152.nii.gz \
            -o site/neuroatlas/data/mni152.nii.gz

          # Pin the AAL image and label table to the reviewed NiiVue revision.
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue/ee9aefce6ce006a8b1a466434cc0d7ba2ac58344/packages/niivue/demos/images/aal.nii.gz \
            -o site/neuroatlas/data/aal.nii.gz
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue/ee9aefce6ce006a8b1a466434cc0d7ba2ac58344/packages/niivue/demos/images/aal.json \
            -o site/neuroatlas/data/aal.json

          # JHU ICBM-DTI-81 white-matter labels remain same-origin in the app.
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/MASILab/PreQual/09c64b495284cc7145617d31650a7819f71bd0a1/src/SUPPLEMENTAL/JHU-ICBM-labels-1mm.nii.gz \
            -o site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz

          # Harvard-Oxford subcortical atlas supplies lateral ventricles,
          # brainstem, and major deep structures.
          curl -fL --retry 4 --retry-delay 2 \
            https://git.fmrib.ox.ac.uk/fsl/data_atlases/-/raw/2103.0/HarvardOxford/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            -o site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz

          echo "dbbd4542823c1e2b12265c9b7e3cf959ee02ff7829bbf05cdcfbecc0013a00fa  site/neuroatlas/data/mni152.nii.gz" | sha256sum -c -
          echo "af9fcba49420955020e61c72cf28ab89e12662e2ce64659456c10592ad88f834  site/neuroatlas/data/aal.nii.gz" | sha256sum -c -
          echo "d22783485b5f8054c77e03c44b48048d29bcc2633648dcdb2a14377b60e92c24  site/neuroatlas/data/aal.json" | sha256sum -c -
          echo "fac584ec75ff2a8631710d3345df96733ed87d9bde3387f5b462f8d22914ed69  site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz" | sha256sum -c -
          echo "72140df8117250d915b753ca2937e078c917525d206e6185e2c1b4ab703fbfcc  site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz" | sha256sum -c -

          test -s site/neuroatlas/data/mni152.nii.gz
          test -s site/neuroatlas/data/aal.nii.gz
          test -s site/neuroatlas/data/aal.json
          test -s site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz
          test -s site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz

          # The file name is retained for compatibility, but these are real
          # voxels inside each label rather than mathematical centroids.
          python3 site/neuroatlas/build_atlas_centroids.py \
            site/neuroatlas/data/aal.nii.gz \
            site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz \
            site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            site/neuroatlas/data/atlas_centroids.json
          test -s site/neuroatlas/data/atlas_centroids.json
          grep -q 'Precision v7.1' site/neuroatlas/index.html
          grep -q 'standardized MNI152 template' site/neuroatlas/index.html
          grep -q 'THIRD_PARTY_NOTICES.md' site/neuroatlas/index.html
          grep -q "'./data/mni152.nii.gz'" site/neuroatlas/index.html
          grep -q "'./data/aal.nii.gz'" site/neuroatlas/index.html
          grep -q "'./data/aal.json'" site/neuroatlas/index.html
          ! grep -q 'real MRI' site/neuroatlas/index.html
          ! grep -q 'authentic MRI-derived' site/neuroatlas/index.html
          ! grep -q 'and Team' site/neuroatlas/index.html
          grep -q 'midlineVentricleAtCursor' site/neuroatlas/index.html
          grep -q 'bilateralExact' site/neuroatlas/index.html
          grep -q 'Rostral medulla' site/neuroatlas/index.html
          grep -q 'validated label voxel' site/neuroatlas/index.html
          grep -q 'Left lateral ventricle' site/neuroatlas/index.html
          grep -q 'forceVisible=false' site/neuroatlas/index.html
          grep -q 'function bestNearbyLabel' site/neuroatlas/index.html
          grep -q 'Sharp color boundaries' site/neuroatlas/index.html
          grep -q 'open medulla' site/neuroatlas/index.html
          grep -q 'Ventricular landmark' site/neuroatlas/index.html
          grep -q 'Created by Dr. Shashank Neupane and Team' site/neuroatlas/index.html
          grep -q 'LABEL THIS CROSS SECTION' site/neuroatlas/index.html
          grep -q 'function collectCrossCandidates' site/neuroatlas/index.html
          grep -q 'HD TEXTBOOK CROSS SECTION' site/neuroatlas/index.html
          grep -q 'function renderTextbookPlate' site/neuroatlas/index.html
          grep -q 'Create a dense HD textbook-style labeled copy' site/neuroatlas/index.html
          grep -q 'DOWNLOAD IMAGE' site/neuroatlas/index.html
          grep -q 'function downloadCrossSection' site/neuroatlas/index.html
          grep -q 'function spatialPick' site/neuroatlas/index.html
          grep -q 'function drawCrossWatermark' site/neuroatlas/index.html
          grep -q 'limit=mobile?36:52' site/neuroatlas/index.html
          ! grep -q 'lines.slice(0,2)' site/neuroatlas/index.html
          ! grep -q 'function renderCrossPins' site/neuroatlas/index.html
          ! grep -q 'cross-list' site/neuroatlas/index.html
          grep -q '<option value="0" selected>Filled regions</option>' site/neuroatlas/index.html
          python3 -c "from pathlib import Path; s=Path('site/neuroatlas/index.html').read_text(); assert '—' not in s and '–' not in s"
          python3 -c "from pathlib import Path; import re; s=Path('site/neuroatlas/index.html').read_text(); m=re.search(r'<script type=\"module\">\s*(.*?)</script>',s,re.S); assert m; Path('/tmp/neuroatlas.mjs').write_text(m.group(1))"
          node --check /tmp/neuroatlas.mjs
          ls -lh site/neuroatlas/data site/neuroatlas/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
