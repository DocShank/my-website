name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build original NeuroAtlas v1 with self-hosted HD assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          rsync -a --exclude '.git' --exclude 'site' ./ site/
          cp site/neuroatlas/original_v1_restored.html site/neuroatlas/index.html
          mkdir -p site/neuroatlas/vendor site/neuroatlas/data

          curl -fL --retry 4 --retry-delay 2 \
            https://unpkg.com/@niivue/niivue@0.69.0/dist/index.js \
            -o site/neuroatlas/vendor/niivue.js \
          || curl -fL --retry 4 --retry-delay 2 \
            https://cdn.jsdelivr.net/npm/@niivue/niivue@0.69.0/dist/index.js \
            -o site/neuroatlas/vendor/niivue.js

          curl -fL --retry 4 --retry-delay 2 \
            https://niivue.github.io/niivue-demo-images/mni152.nii.gz \
            -o site/neuroatlas/data/mni152.nii.gz

          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue/main/packages/niivue/demos/images/aal.nii.gz \
            -o site/neuroatlas/data/aal.nii.gz

          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue/main/packages/niivue/demos/images/aal.json \
            -o site/neuroatlas/data/aal.json

          test -s site/neuroatlas/vendor/niivue.js
          test -s site/neuroatlas/data/mni152.nii.gz
          test -s site/neuroatlas/data/aal.nii.gz
          test -s site/neuroatlas/data/aal.json
          ls -lh site/neuroatlas/vendor site/neuroatlas/data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
