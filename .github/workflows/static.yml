name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NeuroAtlas precision-label release
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          rsync -a --exclude '.git' --exclude 'site' ./ site/
          sed -i 's/pat.subn(rep,s,1)/pat.subn(lambda m: rep,s,1)/g' neuroatlas/neuroatlas_precision_patch.py
          python3 neuroatlas/neuroatlas_precision_patch.py site/neuroatlas/index.html
          grep -q 'SELECTED STRUCTURE' site/neuroatlas/index.html
          grep -q 'Left lateral ventricle' site/neuroatlas/index.html
          grep -q 'mapOnly' site/neuroatlas/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
