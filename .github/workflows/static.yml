name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NeuroAtlas precision v3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          rsync -a --exclude '.git' --exclude 'site' ./ site/

          # Reconstruct the protected precision-v2 viewer, then apply only
          # search, labeling, outline, ventricle, and brainstem precision fixes.
          python3 site/neuroatlas/build_precision_v2.py site/neuroatlas/index.html
          echo "97ec42ae1b3c5966ad6ffca9e8072aca447daa546ba67ac04256687b66f18c29  site/neuroatlas/index.html" | sha256sum -c -
          python3 site/neuroatlas/precision_v3_patch.py site/neuroatlas/index.html
          echo "a010ace3cb0c88e83a92fd9d2ca2ebac8597cd62e5b477b0eab66e32caa03b95  site/neuroatlas/index.html" | sha256sum -c -

          mkdir -p site/neuroatlas/data

          # AAL is temporary here and is used only to build guaranteed
          # in-label search landing points.
          curl -fL --retry 4 --retry-delay 2 \
            https://niivue.com/demos/images/aal.nii.gz \
            -o site/neuroatlas/data/aal_centroid.nii.gz \
          || curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/niivue/niivue/main/packages/niivue/demos/images/aal.nii.gz \
            -o site/neuroatlas/data/aal_centroid.nii.gz

          # JHU ICBM-DTI-81 white-matter labels remain same-origin in the app.
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/MASILab/PreQual/master/src/SUPPLEMENTAL/JHU-ICBM-labels-1mm.nii.gz \
            -o site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz

          # Harvard-Oxford subcortical atlas supplies lateral ventricles,
          # brainstem, and major deep structures.
          curl -fL --retry 4 --retry-delay 2 \
            https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            -o site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
          || curl -fL --retry 4 --retry-delay 2 \
            https://git.fmrib.ox.ac.uk/fsl/data_atlases/-/raw/2103.0/HarvardOxford/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            -o site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
          || curl -fL --retry 4 --retry-delay 2 \
            https://ftp.nmr.mgh.harvard.edu/pub/dist/freesurfer/tutorial_packages_centos6/centos6/freesurfer-fsl-matlab-Linux-centos6_x86_64-dev/freesurfer/fsl_507/data/atlases/HarvardOxford/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            -o site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz

          test -s site/neuroatlas/data/aal_centroid.nii.gz
          test -s site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz
          test -s site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz

          # The file name is retained for compatibility, but these are now
          # real voxels inside each label rather than mathematical centroids.
          python3 site/neuroatlas/build_atlas_centroids.py \
            site/neuroatlas/data/aal_centroid.nii.gz \
            site/neuroatlas/data/JHU-ICBM-labels-1mm.nii.gz \
            site/neuroatlas/data/HarvardOxford-sub-maxprob-thr25-2mm.nii.gz \
            site/neuroatlas/data/atlas_centroids.json
          rm site/neuroatlas/data/aal_centroid.nii.gz

          test -s site/neuroatlas/data/atlas_centroids.json
          grep -q 'midlineVentricleAtCursor' site/neuroatlas/index.html
          grep -q 'bilateralExact' site/neuroatlas/index.html
          grep -q 'Rostral medulla' site/neuroatlas/index.html
          grep -q 'validated label voxel' site/neuroatlas/index.html
          grep -q 'Left lateral ventricle' site/neuroatlas/index.html
          grep -q 'forceVisible=false' site/neuroatlas/index.html
          python3 -c "from pathlib import Path; import re; s=Path('site/neuroatlas/index.html').read_text(); m=re.search(r'<script type=\"module\">\s*(.*?)</script>',s,re.S); assert m; Path('/tmp/neuroatlas.mjs').write_text(m.group(1))"
          node --check /tmp/neuroatlas.mjs
          ls -lh site/neuroatlas/data site/neuroatlas/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
